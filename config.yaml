DESIGN_NAME: rv32i_rformat_datapath

VERILOG_FILES: dir::src/*.v

CLOCK_PORT: clk
CLOCK_PERIOD: 10

PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc

FP_SIZING: absolute
 #DIE_AREA: [0, 0, 111, 111]
 #CORE_AREA: [10, 10, 101, 101]

DIE_AREA: [0, 0, 160, 160]
CORE_AREA: [10.120, 10.880, 150.120, 150.880]


# PDN
PDN_VOFFSET: 5
PDN_HOFFSET: 5
PDN_VWIDTH: 2
PDN_HWIDTH: 2
PDN_VPITCH: 30
PDN_HPITCH: 30
PDN_SKIPTRIM: true
FP_PDN_CORE_RING: TRUE
FP_PDN_ENABLE_RAILS: TRUE
  #FP_PDN_HORIZONTAL_LAYER: MET4
  #FP_PDN_VERTICAL_LAYER: MET5  
FP_PDN_CORE_RING_VWIDTH: 1.6
FP_PDN_CORE_RING_HWIDTH: 1.6
FP_PDN_CORE_RING_VOFFSET: 2.5
FP_PDN_CORE_RING_HOFFSET: 2.5




# Pin Order
IO_PIN_ORDER_CFG: dir::pin_order.cfg

# Technology-Specific Configs
pdk::sky130*:
  FP_CORE_UTIL: 60
  CLOCK_PERIOD: 10.0
  scl::sky130_fd_sc_hs:
    CLOCK_PERIOD: 8
  scl::sky130_fd_sc_ls:
    MAX_FANOUT_CONSTRAINT: 5 
pdk::gf180mcu*:
  CLOCK_PERIOD: 24.0
  FP_CORE_UTIL: 38
  MAX_FANOUT_CONSTRAINT: 4
  PL_TARGET_DENSITY: 0.5
 
